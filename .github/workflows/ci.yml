name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-server:
    name: core server (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Byte-compile
        run: python -m py_compile scripts/*.py
      - name: Stdio harness against the stub backend
        run: python scripts/test_core_server.py
      - name: Session hook
        run: python scripts/test_session_hook.py
      - name: Action hook
        run: python scripts/test_action_hook.py
      - name: Browser proxy, permission hook and swarm runner
        run: python scripts/test_browsers.py
      - name: Actor agents in sync
        run: python scripts/test_agents_in_sync.py
      - name: Relay study matrix grader
        run: python e2e/test_relay_matrix.py

  manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json, .mcp.json, hooks.json and browser files are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json hooks/hooks.json browser/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate --strict
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          claude plugin validate --strict .
      - name: Every skill and agent has frontmatter with a name
        run: |
          status=0
          for f in skills/*/SKILL.md agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "missing frontmatter: $f"; status=1; }
            grep -qm1 '^name: ' "$f" || { echo "missing name: $f"; status=1; }
          done
          exit $status

  figma:
    name: figma plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: figma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: figma/package-lock.json
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and main thread tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Manifest points at the built files
        run: npm run check:manifest
